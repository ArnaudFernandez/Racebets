spring.application.name=racebets
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.jpa.open-in-view=false
racebets.dev-admin.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
racebets.google.enabled=${GOOGLE_AUTH_ENABLED:false}
racebets.google.client-id=${GOOGLE_CLIENT_ID:}
racebets.google.client-secret=${GOOGLE_CLIENT_SECRET:}
racebets.google.login-code-ttl=${GOOGLE_LOGIN_CODE_TTL:PT1M}
server.servlet.session.timeout=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
