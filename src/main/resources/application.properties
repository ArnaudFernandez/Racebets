spring.application.name=racebets
spring.profiles.default=local
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.jpa.open-in-view=false
racebets.dev-admin.enabled=false
racebets.demo-word-cloud.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
racebets.google.enabled=${GOOGLE_AUTH_ENABLED:false}
racebets.google.client-id=${GOOGLE_CLIENT_ID:}
racebets.google.client-secret=${GOOGLE_CLIENT_SECRET:}
racebets.google.login-code-ttl=${GOOGLE_LOGIN_CODE_TTL:PT1M}
server.servlet.session.timeout=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
racebets.auth.max-attempts=${AUTH_MAX_ATTEMPTS:10}
racebets.auth.attempt-window=${AUTH_ATTEMPT_WINDOW:PT15M}
racebets.auth.block-duration=${AUTH_BLOCK_DURATION:PT15M}
racebets.auth.max-tracked-accounts=${AUTH_MAX_TRACKED_ACCOUNTS:100000}
