name: racebets-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-racebets_staging}
      POSTGRES_USER: ${POSTGRES_USER:-racebets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    stop_grace_period: 30s
    networks:
      - racebets

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in Dokploy}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-racebets_staging}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-racebets}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:?Set SPRING_JPA_HIBERNATE_DDL_AUTO in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Djava.io.tmpdir=/tmp}
      RACEBETS_DEV_ADMIN_ENABLED: ${RACEBETS_DEV_ADMIN_ENABLED:-false}
      RACEBETS_DEV_ADMIN_EMAIL: ${RACEBETS_DEV_ADMIN_EMAIL:-}
      RACEBETS_DEV_ADMIN_ACCESS_CODE: ${RACEBETS_DEV_ADMIN_ACCESS_CODE:-}
    expose:
      - "8080"
    networks:
      - racebets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    logging: *default-logging
    stop_grace_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in Dokploy}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - racebets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,mode=1777,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    logging: *default-logging
    stop_grace_period: 15s

volumes:
  postgres_data:

networks:
  racebets:
    driver: bridge
