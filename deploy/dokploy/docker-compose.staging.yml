name: racebets-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-racebets_staging}
      POSTGRES_USER: ${POSTGRES_USER:-racebets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - racebets

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in Dokploy}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-racebets_staging}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-racebets}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    expose:
      - "8080"
    networks:
      - racebets

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in Dokploy}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    expose:
      - "80"
    networks:
      - racebets

volumes:
  postgres_data:

networks:
  racebets:
    driver: bridge
